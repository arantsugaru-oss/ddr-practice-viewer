<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>DDR Practice Viewer v0.2.1</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel2: #f8fafc;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
      --accent2: #14b8a6;
      --danger: #b91c1c;
      --warning: #b45309;
      --shadow: 0 8px 24px rgba(15, 23, 42, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1020;
        --panel: #111827;
        --panel2: #172033;
        --text: #f8fafc;
        --muted: #9ca3af;
        --line: #273449;
        --accent: #2dd4bf;
        --accent2: #5eead4;
        --danger: #f87171;
        --warning: #fbbf24;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input {
      font: inherit;
    }

    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 5vw, 28px);
      letter-spacing: -.02em;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .controls {
      padding: 14px 14px 8px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .control-group + .control-group {
      margin-top: 16px;
    }

    .control-title {
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 14px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-width: 48px;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
    }

    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      cursor: pointer;
      user-select: none;
    }

    .check-row input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 8px;
    }

    .count {
      font-weight: 850;
      font-size: 15px;
    }

    .sort-note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .list {
      display: grid;
      gap: 10px;
      padding: 0 14px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .title {
      margin: 0;
      font-weight: 850;
      line-height: 1.35;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 30px;
      padding: 4px 8px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid var(--line);
      background: var(--panel2);
    }

    .badge.chart {
      color: #fff;
      border-color: transparent;
    }

    /* DDRの譜面カラーに合わせる */
    .badge.chart.esp {
      background: #16a34a;
    }

    .badge.chart.csp {
      background: #7e22ce;
    }

    .card.esp {
      border-left: 5px solid #16a34a;
    }

    .card.csp {
      border-left: 5px solid #7e22ce;
    }

    /* 絞り込みボタンもESP=緑 / CSP=紫 */
    .chip[data-chart="ESP"].active {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }

    .chip[data-chart="CSP"].active {
      background: #7e22ce;
      border-color: #7e22ce;
      color: #fff;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 14px;
      margin-top: 11px;
      align-items: center;
    }

    .lastplay {
      font-weight: 800;
      font-size: 14px;
    }

    .days {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .unplayed {
      color: var(--danger);
      font-weight: 900;
    }

    .submeta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .empty {
      margin: 24px 14px;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .random-banner {
      display: none;
      margin: 4px 14px 10px;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .random-banner.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .small-btn {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 750;
    }

    .bottom-actions {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(920px, 100%);
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
    }

    .primary {
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 900;
      font-size: 15px;
    }

    .secondary {
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 800;
    }

    .file-input {
      display: none;
    }

    .file-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--panel2);
      color: var(--text);
      cursor: pointer;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .data-info {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (min-width: 720px) {
      .controls { padding-inline: 18px; }
      .list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding-inline: 18px;
      }
      .statusbar { padding-inline: 20px; }
      .random-banner { margin-inline: 18px; }
    }
  </style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="header-row">
      <h1>DDR Practice Viewer</h1>
      <div class="version">v0.2.1</div>
    </div>
  </header>

  <section class="controls">
    <div class="panel">
      <div class="control-group">
        <div class="control-title">Lvで絞り込み</div>
        <div class="chips" id="levelChips"></div>
      </div>

      <div class="control-group">
        <div class="control-title">譜面</div>
        <div class="chips">
          <button class="chip active" data-chart="ESP">ESP</button>
          <button class="chip active" data-chart="CSP">CSP</button>
        </div>
      </div>

      <div class="control-group">
        <label class="check-row">
          <input type="checkbox" id="unplayedOnly">
          <strong>未プレイのみ</strong>
        </label>
      </div>

      <div class="data-row">
        <div class="data-info" id="dataInfo">
          初期データを読み込み済み
        </div>
        <label class="file-label">
          CSVを読み込む
          <input class="file-input" id="csvInput" type="file"
                 accept=".csv,text/csv">
        </label>
      </div>
    </div>
  </section>

  <div class="statusbar">
    <div class="count" id="countLabel"></div>
    <div class="sort-note">未プレイ → LAST PLAYが古い順</div>
  </div>

  <div class="random-banner" id="randomBanner">
    <span>🎲 今日の候補10曲</span>
    <button class="small-btn" id="backToList">通常一覧に戻る</button>
  </div>

  <main class="list" id="list"></main>
  <div class="empty" id="empty" hidden>条件に一致する譜面がありません。</div>

  <div class="bottom-actions">
    <button class="primary" id="randomBtn">🎲 今日の候補10曲</button>
    <button class="secondary" id="resetBtn">絞込解除</button>
  </div>
</div>

  let allData = INITIAL_DATA.slice();
  let randomMode = false;
  let randomSelection = [];

  const state = {
    levels: new Set(),
    charts: new Set(["ESP", "CSP"]),
    unplayedOnly: false
  };

  const levelChips = document.getElementById("levelChips");
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countLabel = document.getElementById("countLabel");
  const unplayedOnly = document.getElementById("unplayedOnly");
  const randomBtn = document.getElementById("randomBtn");
  const resetBtn = document.getElementById("resetBtn");
  const randomBanner = document.getElementById("randomBanner");
  const backToList = document.getElementById("backToList");
  const csvInput = document.getElementById("csvInput");
  const dataInfo = document.getElementById("dataInfo");

  function availableLevels() {
    return [...new Set(
      allData.map(x => Number(x.level)).filter(n => Number.isFinite(n) && n > 0)
    )].sort((a, b) => a - b);
  }

  function buildLevelChips() {
    levelChips.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "chip active";
    allBtn.dataset.level = "all";
    allBtn.textContent = "すべて";
    levelChips.appendChild(allBtn);

    for (const level of availableLevels()) {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.dataset.level = String(level);
      btn.textContent = `Lv${level}`;
      levelChips.appendChild(btn);
    }

    syncLevelChipUI();
  }

  function syncLevelChipUI() {
    const buttons = [...levelChips.querySelectorAll(".chip")];
    const allActive = state.levels.size === 0;

    for (const btn of buttons) {
      if (btn.dataset.level === "all") {
        btn.classList.toggle("active", allActive);
      } else {
        btn.classList.toggle(
          "active",
          state.levels.has(Number(btn.dataset.level))
        );
      }
    }
  }

  function syncChartUI() {
    document.querySelectorAll("[data-chart]").forEach(btn => {
      btn.classList.toggle(
        "active",
        state.charts.has(btn.dataset.chart)
      );
    });
  }

  function filteredData() {
    return allData.filter(item => {
      if (
        state.levels.size > 0 &&
        !state.levels.has(Number(item.level))
      ) {
        return false;
      }

      if (!state.charts.has(item.chart)) {
        return false;
      }

      if (
        state.unplayedOnly &&
        item.status !== "未プレイ"
      ) {
        return false;
      }

      return true;
    });
  }

  function sortOldest(items) {
    return items.slice().sort((a, b) => {
      const aUnplayed = a.status === "未プレイ" || !a.lastPlay;
      const bUnplayed = b.status === "未プレイ" || !b.lastPlay;

      if (aUnplayed && !bUnplayed) return -1;
      if (!aUnplayed && bUnplayed) return 1;

      if (aUnplayed && bUnplayed) {
        return (
          Number(b.level || 0) - Number(a.level || 0) ||
          String(a.title).localeCompare(String(b.title), "ja")
        );
      }

      return (
        new Date(a.lastPlay.replace(" ", "T")) -
        new Date(b.lastPlay.replace(" ", "T"))
      );
    });
  }

  function formatDate(value) {
    if (!value) return "";
    const m = value.match(
      /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/
    );
    if (!m) return value;
    return `${m[1]}/${m[2]}/${m[3]} ${m[4]}:${m[5]}`;
  }

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function cardHTML(item, index) {
    const unplayed = item.status === "未プレイ" || !item.lastPlay;
    const lastText = unplayed
      ? '<span class="unplayed">未プレイ</span>'
      : `LAST PLAY：${escapeHTML(formatDate(item.lastPlay))}`;

    const daysText = unplayed
      ? ""
      : (
          Number.isFinite(Number(item.daysAgo))
          ? `${Number(item.daysAgo)}日前`
          : ""
        );

    const scoreText =
      item.bestScore != null && item.bestScore !== ""
      ? `BEST ${Number(item.bestScore).toLocaleString("ja-JP")}`
      : "";

    const playCountText =
      Number.isFinite(Number(item.playCount))
      ? `PLAY ${Number(item.playCount)}`
      : "";

    const numberPrefix = randomMode
      ? `<span style="color:var(--muted);font-weight:900;margin-right:6px;">${index + 1}.</span>`
      : "";

    return `
      <article class="card ${item.chart === "ESP" ? "esp" : item.chart === "CSP" ? "csp" : ""}">
        <div class="card-top">
          <h2 class="title">${numberPrefix}${escapeHTML(item.title)}</h2>
          <div class="badges">
            <span class="badge chart ${item.chart === "ESP" ? "esp" : item.chart === "CSP" ? "csp" : ""}">${escapeHTML(item.chart)}</span>
            <span class="badge">Lv${escapeHTML(item.level)}</span>
          </div>
        </div>

        <div class="meta">
          <div class="lastplay">${lastText}</div>
          <div class="days">${escapeHTML(daysText)}</div>
        </div>

        <div class="submeta">
          ${scoreText ? `<span>${escapeHTML(scoreText)}</span>` : ""}
          ${playCountText ? `<span>${escapeHTML(playCountText)}</span>` : ""}
        </div>
      </article>
    `;
  }

  function render() {
    const base = filteredData();
    let rows;

    if (randomMode) {
      const validKeys = new Set(
        base.map(x => `${x.songId}|${x.chart}`)
      );
      randomSelection = randomSelection.filter(
        x => validKeys.has(`${x.songId}|${x.chart}`)
      );
      rows = randomSelection;
    } else {
      rows = sortOldest(base);
    }

    countLabel.textContent = randomMode
      ? `候補 ${rows.length}譜面 / 対象 ${base.length}譜面`
      : `表示 ${rows.length}譜面`;

    randomBanner.classList.toggle("show", randomMode);
    randomBtn.textContent = randomMode
      ? "🎲 もう一度10曲選ぶ"
      : "🎲 今日の候補10曲";

    listEl.innerHTML = rows
      .map((item, i) => cardHTML(item, i))
      .join("");

    emptyEl.hidden = rows.length > 0;
  }

  function random10() {
    const pool = filteredData().slice();

    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    randomSelection = pool.slice(0, 10);
    randomMode = true;
    render();

    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  levelChips.addEventListener("click", event => {
    const btn = event.target.closest("[data-level]");
    if (!btn) return;

    const value = btn.dataset.level;

    if (value === "all") {
      state.levels.clear();
    } else {
      const level = Number(value);

      if (state.levels.has(level)) {
        state.levels.delete(level);
      } else {
        state.levels.add(level);
      }
    }

    randomMode = false;
    syncLevelChipUI();
    render();
  });

  document.querySelectorAll("[data-chart]").forEach(btn => {
    btn.addEventListener("click", () => {
      const chart = btn.dataset.chart;

      if (state.charts.has(chart)) {
        if (state.charts.size > 1) {
          state.charts.delete(chart);
        }
      } else {
        state.charts.add(chart);
      }

      randomMode = false;
      syncChartUI();
      render();
    });
  });

  unplayedOnly.addEventListener("change", () => {
    state.unplayedOnly = unplayedOnly.checked;
    randomMode = false;
    render();
  });

  randomBtn.addEventListener("click", random10);

  backToList.addEventListener("click", () => {
    randomMode = false;
    randomSelection = [];
    render();
  });

  resetBtn.addEventListener("click", () => {
    state.levels.clear();
    state.charts = new Set(["ESP", "CSP"]);
    state.unplayedOnly = false;
    unplayedOnly.checked = false;
    randomMode = false;
    randomSelection = [];
    syncLevelChipUI();
    syncChartUI();
    render();
  });

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];

      if (inQuotes) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = false;
          }
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ",") {
          row.push(field);
          field = "";
        } else if (ch === "\n") {
          row.push(field.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }
    }

    if (field.length || row.length) {
      row.push(field.replace(/\r$/, ""));
      rows.push(row);
    }

    if (!rows.length) return [];

    const headers = rows[0].map(x => x.replace(/^\uFEFF/, "").trim());

    return rows.slice(1)
      .filter(r => r.some(v => String(v).trim() !== ""))
      .map(r => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = r[i] ?? "";
        });
        return obj;
      });
  }

  function normalizeCSVRows(rows) {
    return rows.map(r => {
      const status =
        (r["ステータス"] || "").trim();

      const rawLast =
        (r["LAST PLAY"] || "").trim();

      const unplayed =
        status === "未プレイ" ||
        rawLast === "未プレイ" ||
        !rawLast;

      const daysRaw =
        (r["経過日数"] || "").trim();

      const scoreRaw =
        (r["BEST SCORE"] || "").trim();

      const playRaw =
        (r["PLAY COUNT"] || "").trim();

      return {
        title: r["曲名"] || "",
        chart: r["譜面"] || "",
        level: Number(r["Lv"] || 0),
        status: unplayed ? "未プレイ" : "プレイ済み",
        lastPlay: unplayed ? "" : rawLast,
        daysAgo: daysRaw === "" ? null : Number(daysRaw),
        bestScore: scoreRaw === "" ? null : Number(scoreRaw),
        playCount: playRaw === "" ? 0 : Number(playRaw),
        songId: r["曲ID"] || ""
      };
    }).filter(x =>
      x.title &&
      ["ESP", "CSP"].includes(x.chart) &&
      Number.isFinite(x.level) &&
      x.level > 0
    );
  }

  csvInput.addEventListener("change", async () => {
    const file = csvInput.files?.[0];
    if (!file) return;

    try {
      const text = await file.text();
      const parsed = parseCSV(text);
      const normalized = normalizeCSVRows(parsed);

      if (!normalized.length) {
        throw new Error("対応するDDRDB CSVデータを読み込めませんでした。");
      }

      allData = normalized;
      randomMode = false;
      randomSelection = [];
      state.levels.clear();
      state.charts = new Set(["ESP", "CSP"]);
      state.unplayedOnly = false;
      unplayedOnly.checked = false;

      buildLevelChips();
      syncChartUI();
      render();

      dataInfo.textContent =
        `${file.name} / ${allData.length}譜面`;

    } catch (e) {
      alert(`CSVの読み込みに失敗しました。\n${e.message}`);
    } finally {
      csvInput.value = "";
    }
  });

  buildLevelChips();
  syncChartUI();
  dataInfo.textContent =
    `初期データ / ${allData.length}譜面`;
  render();
</script>
